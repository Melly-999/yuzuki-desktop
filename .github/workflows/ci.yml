name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: API check
        run: npm run api:check

      - name: Verify adapter
        run: npm run verify:adapter

      - name: Server tests
        run: node --test server/tests/*.test.mjs
        env:
          NODE_OPTIONS: --no-warnings

      - name: Frontend contract tests
        run: node --test src/desktop/*.test.mjs
        env:
          NODE_OPTIONS: --no-warnings

      - name: Screenshot route boundary tests
        run: node --test tests/showcase/verify-screenshot-route-boundary.mjs
        env:
          NODE_OPTIONS: --no-warnings